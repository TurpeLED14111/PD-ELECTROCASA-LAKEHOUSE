bundle:
  name: pd-electrocasa-lakehouse

variables:
  catalogo:
    description: Catálogo destino de Unity Catalog
    default: electrocasa_dev
  tracking_pipeline_id:
    description: ID del pipeline de Lakeflow Connect para dbo.TrackingEnvios
    default: "c2ea1eb1-b9f1-4134-9276-6a3ffdfa76be"
  alert_email:
    description: Correo que recibe las alertas del job
    default: rensoturpolb@gmail.com
  is_dev:
    description: Activa modo desarrollo en el pipeline
    default: true

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    variables:
      catalogo: electrocasa_dev
      is_dev: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/rensoturpolb@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalogo: electrocasa_prod
      is_dev: false