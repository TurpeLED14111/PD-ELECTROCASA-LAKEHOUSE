fuente: tracking_envios
version: 1
ultima_actualizacion: "2026-11-23"
responsable: logistica_y_courier_externo
llegada: "Azure SQL Database, tabla dbo.TrackingEnvios"
metodo_ingesta: "Conector query-based de SQL Server (Lakeflow Connect)"
connection_unity_catalog: "conn_electrocasa_sql"
cursor: fecha_modificacion
modo_historia: "append_only para conservar cada cambio de estado cronologico de un mismo tracking_id"
frecuencia_esperada: "por_ejecucion_de_job"
tabla_bronze: "electrocasa_dev.bronze.tracking_envios"
tabla_silver: "electrocasa_dev.silver.tracking_envios"
llave: evento_id
depende_de:
  - fuente: ventas
    columna: venta_id

columnas:
  - nombre: evento_id
    tipo: "int"
    nulo: false
  - nombre: tracking_id
    tipo: "string"
    nulo: false
  - nombre: venta_id
    tipo: "string"
    nulo: false
    regla: "se conserva en Silver aunque no exista en ventas para no perder metricas logisticas del courier"
  - nombre: courier
    tipo: "string"
    nulo: false
  - nombre: estado_entrega
    tipo: "string"
    nulo: false
    valores_permitidos: ["pendiente", "en_transito", "entregado", "devuelto"]
  - nombre: sucursal_origen
    tipo: "string"
    nulo: false
  - nombre: fecha_actualizacion
    tipo: "date"
    nulo: true
  - nombre: fecha_modificacion
    tipo: "timestamp"
    nulo: false

reglas_de_calidad:
  - nombre: estado_conocido
    condicion: "estado_entrega IN ('pendiente', 'en_transito', 'entregado', 'devuelto') AND evento_id IS NOT NULL"
    politica: "drop"
    destino_rechazos: "electrocasa_dev.silver.cuarentena"
    justificacion: "Estados fuera del conjunto cerrado impiden calcular tiempos de entrega y porcentaje de devueltos en Gold"

transformaciones_silver:
  - "Estandarizar variantes de estado_entrega ('En camino', 'EN_CAMINO', 'en_transito' -> 'en_transito') y casing de courier"
  - "Eliminar mensajes reprocesados deduplicando por (tracking_id, estado_entrega, fecha_modificacion) conservando el primer evento_id"

problemas_conocidos:
  - problema: "Casing inconsistente en courier y estado_entrega; mensajes reprocesados con distinto evento_id; fecha_actualizacion nula"
    ejemplo: "estado_entrega='En camino' / 'EN_CAMINO'"
    filas_afectadas: "15.139 eventos totales en Bronze"
    tratamiento: "Estandarizacion de estados y deduplicacion de mensajes reprocesados en Silver"